{% extends 'dashboard_base.html' %}
{% block title %}Visualización 3D | {{ well.name }}{% endblock %}

{% block dashboard_content %}
<div class="h-screen flex flex-col bg-slate-50 overflow-hidden relative" style="height: calc(100vh - 80px);">
    <!-- Overlay Controls / Info -->
    <div class="absolute top-4 left-4 z-10 bg-white/90 backdrop-blur text-slate-800 p-4 rounded-lg border border-slate-200 shadow-xl max-w-xs transition-opacity duration-300 pointer-events-auto">
        <div class="flex items-center justify-between mb-2">
            <h2 class="text-lg font-bold">{{ well.name }}</h2>
            <a href="{% url 'surveys:well_list' %}" class="text-slate-400 hover:text-slate-600 transition-colors">
                <i class="fa-solid fa-times"></i>
            </a>
        </div>
        <div class="text-xs text-slate-500 space-y-1 mb-4">
            <p><span class="text-slate-400">Ubicación:</span> {{ well.location }}</p>
            <p><span class="text-slate-400">Elevación:</span> {{ well.elevation }}m</p>
        </div>
        
        <!-- Preset Views -->
        <div class="space-y-2">
            <button id="view-top" class="w-full py-1 px-3 bg-slate-200 hover:bg-slate-300 rounded text-xs transition-colors font-medium">Vista Superior</button>
            <button id="view-side" class="w-full py-1 px-3 bg-slate-200 hover:bg-slate-300 rounded text-xs transition-colors font-medium">Vista Lateral</button>
            <button id="view-reset" class="w-full py-1 px-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs transition-colors font-medium">Resetear Cámara</button>
        </div>

        <!-- Depth Slider -->
        <div class="mt-4 pt-4 border-t border-slate-100">
            <label for="depth-slider" class="block text-xs font-semibold text-slate-600 mb-1">Profundidad (MD): <span id="depth-val">0</span>m</label>
            <input type="range" id="depth-slider" min="0" max="100" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
        </div>

        <!-- Legend -->
        <div class="mt-4 pt-4 border-t border-slate-100">
             <h4 class="text-xs font-semibold mb-2">Leyenda Mecánica</h4>
             <div id="legend-container" class="space-y-1 max-h-40 overflow-y-auto pr-1 scrollbar-thin scrollbar-thumb-slate-300">
                 <!-- Generated by JS -->
             </div>
        </div>
    </div>

    <!-- Camera Control Pad (Bottom Right) -->
    <div class="absolute bottom-8 right-8 z-10 bg-white/90 backdrop-blur p-2 rounded-lg border border-slate-200 shadow-xl pointer-events-auto flex flex-col items-center gap-1">
        <button id="cam-up" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-slate-700 transition" title="Mover Arriba">
            <i class="fa-solid fa-arrow-up"></i>
        </button>
        <div class="flex gap-1">
            <button id="cam-left" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-slate-700 transition" title="Mover Izquierda">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button id="cam-down" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-slate-700 transition" title="Mover Abajo">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
            <button id="cam-right" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-slate-700 transition" title="Mover Derecha">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        <div class="flex gap-1 mt-2 border-t pt-2 border-slate-200 w-full justify-center">
            <button id="cam-zoom-in" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-slate-700 transition" title="Acercar">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button id="cam-zoom-out" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-slate-700 transition" title="Alejar">
                <i class="fa-solid fa-minus"></i>
            </button>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="w-full h-full"></div>
</div>

<!-- Import Map -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<!-- Load Three.js as Module -->
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Data Handling ---
    let surveyData = [];
    let mechanicalData = [];
    try {
        const rawSurvey = '{{ survey_json|escapejs }}';
        const rawMech = '{{ mechanical_json|escapejs }}';
        if (rawSurvey) surveyData = JSON.parse(rawSurvey);
        if (rawMech) mechanicalData = JSON.parse(rawMech);
    } catch (e) { console.error(e); }

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f4f8);
    scene.fog = new THREE.FogExp2(0xf0f4f8, 0.0002);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 50000);
    camera.position.set(100, 200, 300); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, -50, 0);
    controls.enablePan = true;
    controls.screenSpacePanning = true; // Pan Up/Down instead of forward/back

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2); 
    sunLight.position.set(200, 500, 300);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);
    
    const fillLight = new THREE.DirectionalLight(0xe8f4ff, 0.5);
    fillLight.position.set(-200, 100, -200);
    scene.add(fillLight);

    // --- Procedural Rig Generator ---
    function createProceduralRig() {
        const rigGroup = new THREE.Group();

        // 1. Platform
        const platformGeo = new THREE.BoxGeometry(40, 2, 40);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.y = 1; 
        platform.receiveShadow = true;
        rigGroup.add(platform);

        // 2. Derrick (Torre) - Red & White
        const legRadius = 0.5;
        const legHeight = 60;
        const baseWidth = 10;
        const topWidth = 4;
        
        const legMatRed = new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.4 });
        const legMatWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.4 });

        // Legs (Angled)
        const legGeo = new THREE.CylinderGeometry(legRadius, legRadius, legHeight);
        
        // Helper to place angled leg
        function addLeg(kx, kz) {
            // Geometry math is tricky for tapered, use vertical segments for MVP visual
            // Or simple tapered box-like construct
            // Let's use 4 vertical cylinders spread out at bottom, closer at top
            // Actually, simpler: Tapered Lattice "Mesh" logic is hard. 
            // Simple approach: Use a tapered BoxGeometry skeleton or line segments.
            // Let's use manual struts.
            
            const leg = new THREE.Mesh(legGeo, legMatRed);
            // Angle them in? Rotate group?
            // Simple: Just 4 vertical poles for stability of code, maybe slight taper manually
            leg.position.set(kx * 8, legHeight/2, kz * 8);
            rigGroup.add(leg);
        }
        // addLeg(1, 1); addLeg(1, -1); addLeg(-1, 1); addLeg(-1, -1);
        
        // BETTER: Use 4 Tapered Cylinders as main legs
        const taperedLegGeo = new THREE.CylinderGeometry(0.8, 1.5, 60, 4);
        const leg1 = new THREE.Mesh(taperedLegGeo, legMatRed);
        leg1.position.set(5, 30, 5);
        leg1.rotation.x = -0.05; leg1.rotation.z = 0.05;
        rigGroup.add(leg1);
        
        const leg2 = new THREE.Mesh(taperedLegGeo, legMatWhite);
        leg2.position.set(-5, 30, 5);
        leg2.rotation.x = -0.05; leg2.rotation.z = -0.05;
        rigGroup.add(leg2);
        
        const leg3 = new THREE.Mesh(taperedLegGeo, legMatRed);
        leg3.position.set(5, 30, -5);
        leg3.rotation.x = 0.05; leg3.rotation.z = 0.05;
        rigGroup.add(leg3);

        const leg4 = new THREE.Mesh(taperedLegGeo, legMatWhite);
        leg4.position.set(-5, 30, -5);
        leg4.rotation.x = 0.05; leg4.rotation.z = -0.05;
        rigGroup.add(leg4);

        // Cross Bracing (X-Shape)
        const braceGeo = new THREE.BoxGeometry(10, 0.5, 0.5);
        for(let i=10; i<60; i+=10) {
             const brace = new THREE.Mesh(braceGeo, legMatWhite);
             brace.position.set(0, i, 5.5 - (i/60)*2); // Tapering in z
             rigGroup.add(brace);
             
             const braceSide = new THREE.Mesh(braceGeo, legMatRed);
             braceSide.rotation.y = Math.PI/2;
             braceSide.position.set(5.5 - (i/60)*2, i, 0);
             rigGroup.add(braceSide);
        }

        // Top Block (Crown)
        const crownGeo = new THREE.BoxGeometry(6, 4, 6);
        const crown = new THREE.Mesh(crownGeo, new THREE.MeshStandardMaterial({color: 0xffff00}));
        crown.position.y = 62;
        rigGroup.add(crown);

        // Drawworks / House
        const houseGeo = new THREE.BoxGeometry(8, 6, 12);
        const house = new THREE.Mesh(houseGeo, new THREE.MeshStandardMaterial({color: 0x3366cc}));
        house.position.set(-15, 5, 0);
        rigGroup.add(house);

        return rigGroup;
    }

    // --- Environment / Geology ---
    const groundGeo = new THREE.PlaneGeometry(3000, 3000);
    const groundMat = new THREE.MeshStandardMaterial({ 
        color: 0xe0d5c1, 
        roughness: 0.8,
        metalness: 0,
        side: THREE.FrontSide
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Context Box
    const depth = 2000;
    const width = 2000;
    const wallGeo = new THREE.PlaneGeometry(width, depth);
    const wallMat = new THREE.MeshBasicMaterial({
        color: 0xcccccc,
        transparent: true,
        opacity: 0.15,
        side: THREE.DoubleSide
    });
    const wall1 = new THREE.Mesh(wallGeo, wallMat);
    wall1.position.set(0, -depth/2, -width/2);
    scene.add(wall1);
    const wall2 = new THREE.Mesh(wallGeo, wallMat);
    wall2.position.set(-width/2, -depth/2, 0);
    wall2.rotation.y = Math.PI / 2;
    scene.add(wall2);

    const gridColor1 = 0x888888;
    const gridColor2 = 0xcccccc;
    const depthGrid1 = new THREE.GridHelper(depth, 20, gridColor1, gridColor2);
    depthGrid1.rotation.x = Math.PI / 2;
    depthGrid1.position.set(0, -depth/2, -width/2);
    scene.add(depthGrid1);
    const depthGrid2 = new THREE.GridHelper(depth, 20, gridColor1, gridColor2);
    depthGrid2.rotation.x = Math.PI / 2;
    depthGrid2.rotation.z = Math.PI / 2;
    depthGrid2.position.set(-width/2, -depth/2, 0);
    scene.add(depthGrid2);

    // Replace Cylinder Tower with Procedural Rig
    const rigNode = createProceduralRig();
    rigNode.position.y = 0;
    rigNode.traverse(c => { if(c.isMesh) c.castShadow = true; });
    scene.add(rigNode);


    // --- Wellbore Generation ---
    let globalCurve = null; 
    let maxDepthMD = 0;

    if(surveyData.length > 1) {
        maxDepthMD = surveyData[surveyData.length - 1].md;
        const slider = document.getElementById('depth-slider');
        const depthValDisplay = document.getElementById('depth-val');
        
        if(slider) {
            slider.max = maxDepthMD;
            slider.value = 0;
        }

        const points = surveyData.map(p => new THREE.Vector3(p.east, -p.tvd, p.north));
        globalCurve = new THREE.CatmullRomCurve3(points);

        if(points.length > 0) {
            controls.target.copy(points[0]);
            camera.position.set(points[0].x + 100, points[0].y + 100, points[0].z + 200);
        }

        const legendContainer = document.getElementById('legend-container');
        
        let itemsToDraw = mechanicalData.length > 0 ? mechanicalData : [{
            type: 'Trayectoria', start_md: surveyData[0].md, end_md: maxDepthMD, diameter: 10, color: '#ff0000'
        }];

        itemsToDraw.forEach(item => {
             const maxMD = maxDepthMD;
             let startT = item.start_md / maxMD;
             let endT = item.end_md / maxMD;
             startT = Math.max(0, Math.min(1, startT));
             endT = Math.max(0, Math.min(1, endT));

             if (startT < endT) {
                const segmentPoints = globalCurve.getPoints(300).filter((p, i, arr) => {
                     const t = i / (arr.length - 1);
                     return t >= startT && t <= endT;
                });
                
                if(segmentPoints.length > 1) {
                    const segmentCurve = new THREE.CatmullRomCurve3(segmentPoints);
                    const VISIBILITY_FACTOR = 15; 
                    const radius = (item.diameter * 0.0254 / 2) * VISIBILITY_FACTOR; 
                    
                    const tubeGeo = new THREE.TubeGeometry(segmentCurve, 128, radius, 12, false);
                    const tubeMat = new THREE.MeshPhysicalMaterial({ 
                        color: item.color || 0x444444,
                        metalness: 0.3,
                        roughness: 0.3,
                        clearcoat: 0.8,
                        transparent: true,
                        opacity: 0.7,
                        side: THREE.FrontSide
                    });
                    const mesh = new THREE.Mesh(tubeGeo, tubeMat);
                    mesh.castShadow = true;
                    scene.add(mesh);

                    const div = document.createElement('div');
                    div.className = 'flex items-center text-xs text-slate-600';
                    div.innerHTML = `
                        <span class="w-3 h-3 rounded-full mr-2 block shadow-sm border border-slate-300" style="background-color: ${item.color || '#888'}"></span>
                        <span>${item.type || 'Tramo'} (${item.diameter}"): ${item.start_md}-${item.end_md}m</span>
                    `;
                    legendContainer.appendChild(div);
                }
             }
        });
        
        // --- Slider Event ---
        if(slider && globalCurve) {
            slider.addEventListener('input', (e) => {
                const md = parseFloat(e.target.value);
                depthValDisplay.innerText = md.toFixed(0);
                const t = Math.min(1, Math.max(0, md / maxDepthMD));
                const pointOnCurve = globalCurve.getPoint(t);
                controls.target.copy(pointOnCurve);
                camera.position.set(
                    pointOnCurve.x + 80, 
                    pointOnCurve.y + 40, 
                    pointOnCurve.z + 80
                );
            });
        }
        
    } else {
        console.warn("No survey data points found.");
    }

    // --- On-Screen Controls Logic (Continuous) ---
    const panSpeed = 20; // Speed per frame
    const zoomSpeed = 10;
    
    // Movement State
    const moveState = {
        up: false,
        down: false,
        left: false,
        right: false,
        zoomIn: false,
        zoomOut: false
    };

    function setupButton(id, stateKey) {
        const btn = document.getElementById(id);
        if(!btn) return;
        
        const start = (e) => { e.preventDefault(); moveState[stateKey] = true; };
        const stop = (e) => { e.preventDefault(); moveState[stateKey] = false; };

        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', stop);
        btn.addEventListener('mouseleave', stop);
        
        // Touch support
        btn.addEventListener('touchstart', start, {passive: false});
        btn.addEventListener('touchend', stop);
    }

    setupButton('cam-up', 'up');
    setupButton('cam-down', 'down');
    setupButton('cam-left', 'left');
    setupButton('cam-right', 'right');
    setupButton('cam-zoom-in', 'zoomIn');
    setupButton('cam-zoom-out', 'zoomOut');

    // Helper to pan camera relative to view
    function panCamera(dx, dy) {
         const vRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
         const vUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
         
         const moveVec = new THREE.Vector3()
            .addScaledVector(vRight, dx)
            .addScaledVector(vUp, dy);
            
         camera.position.add(moveVec);
         controls.target.add(moveVec);
    }

    function doZoom(dir) {
        // dir: 1 for in, -1 for out
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        camera.position.addScaledVector(forward, dir * zoomSpeed);
    }

    // --- Animation Loop ---
    function animate() {
        requestAnimationFrame(animate);
        
        // Apply Continuous Movement
        if(moveState.up) panCamera(0, panSpeed);
        if(moveState.down) panCamera(0, -panSpeed);
        if(moveState.left) panCamera(-panSpeed, 0);
        if(moveState.right) panCamera(panSpeed, 0);
        
        if(moveState.zoomIn) doZoom(1);
        if(moveState.zoomOut) doZoom(-1);

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // --- UI Controls ---
    const resetBtn = document.getElementById('view-reset');
    if(resetBtn) resetBtn.addEventListener('click', () => {
        controls.reset();
        if(surveyData.length > 0) {
            controls.target.set(0, -50, 0);
            camera.position.set(100, 200, 300);
        }
    });
    
    document.getElementById('view-top')?.addEventListener('click', () => {
        if(surveyData.length > 0) {
            controls.target.set(0, -surveyData[surveyData.length-1].tvd/2, 0);
            camera.position.set(0, 1000, 0);
            camera.lookAt(0, -500, 0);
            controls.update();
        }
    });

    document.getElementById('view-side')?.addEventListener('click', () => {
         if(surveyData.length > 0) {
            const midDepth = -surveyData[surveyData.length-1].tvd / 2;
            controls.target.set(0, midDepth, 0);
            camera.position.set(1500, midDepth, 0);
            controls.update();
         }
    });

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
{% endblock %}
